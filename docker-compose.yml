# Full stack: `docker compose up` then open http://localhost:3000
# (login: hr / HrAdmin@2026)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: salary_mgmt
      MYSQL_USER: salary
      MYSQL_PASSWORD: salary
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"   # host port 3307 to dodge any native mysqld on 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usalary", "-psalary"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/salary_mgmt?rewriteBatchedStatements=true
      DB_USER: salary
      DB_PASSWORD: salary
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
