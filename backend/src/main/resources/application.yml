spring:
  datasource:
    url: jdbc:mysql://localhost:3307/salary_mgmt?createDatabaseIfNotExist=true&rewriteBatchedStatements=true
    username: ${DB_USER:salary}
    password: ${DB_PASSWORD:salary}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jobs:
    progress-update-every: 100
  pagination:
    max-page-size: 100
  bulk-raise:
    poll-interval-ms: 2000
  analytics:
    distribution-bucket-usd: 50000
  payroll:
    current-month-processable-from-day: 25
    poll-interval-ms: 2000
