spring:
  datasource:
    url: jdbc:mysql://localhost:3307/salary_mgmt?createDatabaseIfNotExist=true
    username: ${DB_USER:salary}
    password: ${DB_PASSWORD:salary}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  pagination:
    max-page-size: 100
  bulk-raise:
    recently-raised-days: 90
    poll-interval-ms: 2000
