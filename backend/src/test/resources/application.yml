spring:
  test:
    database:
      replace: none
  datasource:
    url: jdbc:h2:mem:salary_test;MODE=MySQL;NON_KEYWORDS=YEAR,MONTH;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jobs:
    progress-update-every: 100
  pagination:
    max-page-size: 100
  bulk-raise:
    poll-interval-ms: 2000
  analytics:
    distribution-bucket-usd: 50000
  payroll:
    poll-interval-ms: 2000
