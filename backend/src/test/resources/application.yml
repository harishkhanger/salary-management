spring:
  test:
    database:
      replace: none
  datasource:
    url: jdbc:h2:mem:salary_test;MODE=MySQL;NON_KEYWORDS=YEAR,MONTH;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  pagination:
    max-page-size: 100
  bulk-raise:
    recently-raised-days: 90
